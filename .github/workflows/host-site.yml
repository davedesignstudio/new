name: Host studio site

on:
  push:
    branches:
      - cursor/dphilhower-studio-wordpress-10e5
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: host-studio-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require preview
        run: test -f dphilhower-studio-wp/preview/index.html
      - name: Stage static site
        run: |
          mkdir -p dist
          cp -a dphilhower-studio-wp/preview/. dist/
          touch dist/.nojekyll
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
      - name: Enable GitHub Pages from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f source[branch]=gh-pages \
            -f source[path]='/' || true
          gh api --method PUT repos/${{ github.repository }}/pages \
            -f build_type=legacy \
            -f source[branch]=gh-pages \
            -f source[path]='/' || true

  # Official Pages deploy can create the Pages site when REST enable is denied.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p dist
          cp -a dphilhower-studio-wp/preview/. dist/
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
