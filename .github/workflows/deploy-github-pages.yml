name: Deploy GitHub Pages

on:
  push:
    branches: [master, "cursor/sthills-logo-redesigns-747c"]
    paths:
      - "public/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site for project Pages (/new/)
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a public _site
          touch _site/.nojekyll
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path("_site")
          BASE = "/new"
          for p in root.rglob("*"):
              if p.suffix.lower() not in {".html", ".css", ".js", ".xml"}:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              orig = text
              text = re.sub(r'\b(href|src)=([\'"])/(?!/)', rf"\1=\2{BASE}/", text)
              text = re.sub(r"url\(\s*/(?!/)", f"url({BASE}/", text)
              text = text.replace("https://dphilhowerstudio.com/", f"https://davedesignstudio.github.io{BASE}/")
              if text != orig:
                  p.write_text(text, encoding="utf-8")
          print("prepared", BASE)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
