<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brands-500 knowledge — D Philhower Studio</title>
  <meta name="description" content="Knowledge from brands-500 creations: shelf, technique, Action+Item+Limit, kit status.">
  <link rel="canonical" href="https://dphilhowerstudio.com/knowledge/brands/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand-mark" href="/">D Philhower Studio</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav">
      <a href="/work/">Work</a>
      <a href="/services/">Services</a>
      <a href="/library/">Library</a>
      <a href="/knowledge/" aria-current="page">Knowledge</a>
      <a href="/techniques/">Techniques</a>
      <a href="/about/">About</a>
      <a class="nav-cta" href="/contact/">Start a project</a>
    </nav>
  </header>
  <main>
    <header class="page-hero">
      <p class="section-label">Knowledge · brands-500</p>
      <h1>Pipeline learnings.</h1>
      <p>Filter by shelf or wave. Each card is knowledge distilled from that creation—not only a logo tile.</p>
    </header>
    <section class="section" style="padding-top:0">
      <p class="section-copy" id="bknow-stats">Loading corpus…</p>
      <div class="h100-filters" id="bknow-filters" role="toolbar" aria-label="Filter"></div>
      <div class="know-grid" id="bknow-grid"></div>
    </section>
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>© <span id="y"></span> D Philhower Studio</span><a href="/knowledge/">Knowledge hub</a></div></footer>
  <script>document.getElementById("y").textContent=new Date().getFullYear()</script>
  <script src="/js/main.js"></script>
  <script>
  (async function() {
    const res = await fetch('/knowledge/creations.json');
    const data = await res.json();
    const items = data.creations.filter(c => c.source === 'brands-500');
    const stats = document.getElementById('bknow-stats');
    const grid = document.getElementById('bknow-grid');
    const filters = document.getElementById('bknow-filters');
    const shelves = ['All', ...Array.from(new Set(items.map(i => i.shelf))).sort()];
    let active = 'All';
    function render() {
      const list = active === 'All' ? items : items.filter(i => i.shelf === active);
      stats.textContent = list.length + ' creations' + (active !== 'All' ? ' · ' + active : '') + ' · ' + list.filter(i => i.ready.full_kit).length + ' full kits';
      grid.innerHTML = list.slice(0, 240).map(i => {
        const k = i.knowledge;
        const st = i.ready.full_kit ? 'Full kit' : 'Logo';
        return '<a class="know-card" href="' + i.href + '">' +
          '<img src="' + i.img + '" alt="" loading="lazy" width="512" height="512">' +
          '<span class="know-tech">' + k.technique + '</span>' +
          '<h3>' + i.name + '</h3>' +
          '<p class="know-ail"><strong>' + k.action + '</strong> · ' + k.item + ' · <em>Limit:</em> ' + k.limit + '</p>' +
          '<p class="know-ail">Wave ' + i.wave + ' · ' + st + '</p></a>';
      }).join('');
    }
    shelves.forEach(s => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'h100-filter';
      b.textContent = s;
      b.setAttribute('aria-pressed', s === 'All' ? 'true' : 'false');
      b.addEventListener('click', () => {
        active = s;
        [...filters.children].forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        render();
      });
      filters.appendChild(b);
    });
    render();
  })();
  </script>
</body>
</html>
