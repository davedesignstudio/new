<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sauceDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a1410"/>
      <stop offset="45%" stop-color="#b42318"/>
      <stop offset="100%" stop-color="#e45c24"/>
    </linearGradient>
    <linearGradient id="sauceGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a3a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b120c" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="sauceGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="table" tableValues="0 0.18 0.08 0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
  </defs>
  <rect width="200" height="800" fill="url(#sauceDeep)"/>
  <g filter="url(#sauceGrain)" fill="#c0392b">
    <ellipse cx="40" cy="80" rx="70" ry="110" opacity="0.85"/>
    <ellipse cx="160" cy="220" rx="80" ry="130" opacity="0.7"/>
    <ellipse cx="30" cy="380" rx="90" ry="140" opacity="0.8"/>
    <ellipse cx="170" cy="540" rx="75" ry="120" opacity="0.75"/>
    <ellipse cx="50" cy="700" rx="85" ry="130" opacity="0.8"/>
  </g>
  <g fill="#8b1a12" opacity="0.55">
    <path d="M18 0 C40 40 10 90 28 140 C8 190 42 250 16 310 C38 360 6 420 30 480 C8 540 44 600 18 660 C36 710 12 760 24 800 H0 V0 Z"/>
    <path d="M182 0 C160 50 190 100 172 160 C194 220 158 280 184 340 C160 400 196 460 170 520 C192 580 156 640 182 700 C164 750 188 780 176 800 H200 V0 Z"/>
  </g>
  <g fill="#f0a060" opacity="0.22">
    <ellipse cx="70" cy="130" rx="18" ry="10"/>
    <ellipse cx="140" cy="310" rx="22" ry="12"/>
    <ellipse cx="55" cy="490" rx="16" ry="9"/>
    <ellipse cx="150" cy="650" rx="20" ry="11"/>
  </g>
  <rect width="200" height="800" fill="url(#sauceGloss)"/>
