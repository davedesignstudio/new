<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect width="400" height="320" fill="#f5f0e6"/>
  <!-- sky -->
  <rect width="400" height="180" fill="#e8e0d4"/>
  <!-- ground -->
  <rect y="260" width="400" height="60" fill="#3d5c3a" opacity="0.3"/>
  <!-- house body -->
  <rect x="100" y="140" width="200" height="120" fill="#8B6914" stroke="#5c4610" stroke-width="2"/>
  <!-- siding lines -->
  <line x1="100" y1="160" x2="300" y2="160" stroke="#5c4610" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="180" x2="300" y2="180" stroke="#5c4610" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#5c4610" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="220" x2="300" y2="220" stroke="#5c4610" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="240" x2="300" y2="240" stroke="#5c4610" stroke-width="0.5" opacity="0.4"/>
  <!-- main gable roof -->
  <polygon points="90,140 200,60 310,140" fill="#4a1c2e" stroke="#2d1119" stroke-width="2"/>
  <!-- fish scale shingles -->
  <path d="M120,120 Q140,110 160,120 Q180,110 200,120 Q220,110 240,120 Q260,110 280,120" fill="none" stroke="#2d1119" stroke-width="0.5" opacity="0.3"/>
  <path d="M110,130 Q150,115 200,130 Q250,115 290,130" fill="none" stroke="#2d1119" stroke-width="0.5" opacity="0.3"/>
  <!-- dormer -->
  <polygon points="170,100 200,75 230,100" fill="#5c2030" stroke="#2d1119" stroke-width="1.5"/>
  <rect x="180" y="100" width="40" height="30" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <!-- bay window -->
  <polygon points="130,200 130,160 155,145 180,160 180,200" fill="#a8d4f0" stroke="#5c4610" stroke-width="2"/>
  <line x1="155" y1="145" x2="155" y2="200" stroke="#5c4610" stroke-width="1"/>
  <!-- front door -->
  <rect x="220" y="200" width="40" height="60" rx="2" fill="#4a1c2e" stroke="#2d1119" stroke-width="2"/>
  <circle cx="252" cy="235" r="3" fill="#b8860b"/>
  <!-- window -->
  <rect x="240" y="165" width="35" height="30" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <line x1="257" y1="165" x2="257" y2="195" stroke="#5c4610" stroke-width="1"/>
  <line x1="240" y1="180" x2="275" y2="180" stroke="#5c4610" stroke-width="1"/>
  <!-- porch -->
  <rect x="210" y="255" width="70" height="8" fill="#5c4610"/>
  <rect x="215" y="263" width="8" height="20" fill="#5c4610"/>
  <rect x="267" y="263" width="8" height="20" fill="#5c4610"/>
  <!-- porch railing -->
  <rect x="210" y="248" width="70" height="4" fill="#5c4610"/>
  <line x1="220" y1="248" x2="220" y2="255" stroke="#5c4610" stroke-width="2"/>
  <line x1="235" y1="248" x2="235" y2="255" stroke="#5c4610" stroke-width="2"/>
  <line x1="250" y1="248" x2="250" y2="255" stroke="#5c4610" stroke-width="2"/>
  <line x1="265" y1="248" x2="265" y2="255" stroke="#5c4610" stroke-width="2"/>
  <!-- chimney -->
  <rect x="260" y="70" width="25" height="50" fill="#8B4513" stroke="#5c2e0a" stroke-width="1.5"/>
  <rect x="255" y="68" width="35" height="6" fill="#5c2e0a"/>
  <!-- decorative trim -->
  <line x1="90" y1="140" x2="310" y2="140" stroke="#b8860b" stroke-width="2"/>
  <!-- tree -->
  <rect x="50" y="230" width="12" height="40" fill="#5c4610"/>
  <circle cx="56" cy="215" r="25" fill="#3d5c3a" opacity="0.7"/>
  <circle cx="340" cy="220" r="20" fill="#3d5c3a" opacity="0.6"/>
</svg>