  <rect x="40" y="85" width="50" height="70" fill="#a0782a" stroke="#5c4610" stroke-width="1"/>
  <rect x="120" y="80" width="60" height="80" fill="none" stroke="#5c4610" stroke-width="1.5"/>
  <rect x="125" y="85" width="50" height="70" fill="#a0782a" stroke="#5c4610" stroke-width="1"/>
