  <line x1="20" y1="80" x2="280" y2="80" stroke="#b8860b" stroke-width="3"/>
  <!-- upper wall -->
  <line x1="35" y1="40" x2="265" y2="40" stroke="#5c4610" stroke-width="0.5" opacity="0.3"/>
  <line x1="35" y1="55" x2="265" y2="55" stroke="#5c4610" stroke-width="0.5" opacity="0.3"/>
  <line x1="35" y1="70" x2="265" y2="70" stroke="#5c4610" stroke-width="0.5" opacity="0.3"/>
