<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f5f0e6"/>
  <rect x="20" y="20" width="260" height="160" fill="#8B6914" stroke="#5c4610" stroke-width="2"/>
  <!-- crown moulding -->
  <path d="M20,20 L30,10 L40,20 L50,10 L60,20 L70,10 L80,20 L90,10 L100,20 L110,10 L120,20 L130,10 L140,20 L150,10 L160,20 L170,10 L180,20 L190,10 L200,20 L210,10 L220,20 L230,10 L240,20 L250,10 L260,20 L270,10 L280,20" fill="none" stroke="#b8860b" stroke-width="2"/>
