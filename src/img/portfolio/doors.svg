<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f5f0e6"/>
  <!-- door frame -->
  <rect x="80" y="20" width="140" height="160" fill="#5c4610" stroke="#3d2914" stroke-width="2"/>
  <!-- door panels -->
  <rect x="90" y="30" width="55" height="60" fill="#8B6914" stroke="#5c4610" stroke-width="1.5" rx="2"/>
  <rect x="155" y="30" width="55" height="60" fill="#8B6914" stroke="#5c4610" stroke-width="1.5" rx="2"/>
  <rect x="90" y="100" width="55" height="60" fill="#8B6914" stroke="#5c4610" stroke-width="1.5" rx="2"/>
  <rect x="155" y="100" width="55" height="60" fill="#8B6914" stroke="#5c4610" stroke-width="1.5" rx="2"/>
  <!-- glass transom -->
  <rect x="90" y="20" width="120" height="15" fill="#a8d4f0" stroke="#5c4610" stroke-width="1"/>
  <line x1="110" y1="20" x2="110" y2="35" stroke="#5c4610" stroke-width="0.5"/>
  <line x1="130" y1="20" x2="130" y2="35" stroke="#5c4610" stroke-width="0.5"/>
  <line x1="150" y1="20" x2="150" y2="35" stroke="#5c4610" stroke-width="0.5"/>
  <line x1="170" y1="20" x2="170" y2="35" stroke="#5c4610" stroke-width="0.5"/>
  <line x1="190" y1="20" x2="190" y2="35" stroke="#5c4610" stroke-width="0.5"/>
  <!-- handle -->
  <circle cx="200" cy="120" r="5" fill="#b8860b" stroke="#8B6914" stroke-width="1"/>
</svg>