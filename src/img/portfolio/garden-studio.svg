<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f5f0e6"/>
  <rect y="150" width="300" height="50" fill="#3d5c3a" opacity="0.2"/>
  <rect x="80" y="90" width="140" height="80" fill="#8B6914" stroke="#5c4610" stroke-width="2"/>
  <polygon points="70,90 150,40 230,90" fill="#4a1c2e" stroke="#2d1119" stroke-width="2"/>
  <!-- fretwork -->
  <path d="M130,55 L150,40 L170,55 M125,60 L150,45 L175,60" fill="none" stroke="#b8860b" stroke-width="1"/>
  <!-- french doors -->
  <rect x="110" y="110" width="35" height="60" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <rect x="155" y="110" width="35" height="60" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <line x1="127" y1="110" x2="127" y2="170" stroke="#5c4610" stroke-width="0.5"/>
  <line x1="172" y1="110" x2="172" y2="170" stroke="#5c4610" stroke-width="0.5"/>
  <!-- side window -->
  <rect x="85" y="110" width="20" height="25" fill="#a8d4f0" stroke="#5c4610" stroke-width="1"/>
  <rect x="195" y="110" width="20" height="25" fill="#a8d4f0" stroke="#5c4610" stroke-width="1"/>
  <!-- garden path -->
  <path d="M150,170 L150,200" stroke="#aaa" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
</svg>