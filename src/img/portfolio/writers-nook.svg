<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f5f0e6"/>
  <!-- bookcases -->
  <rect x="30" y="30" width="50" height="140" fill="#8B6914" stroke="#5c4610" stroke-width="1.5"/>
  <rect x="220" y="30" width="50" height="140" fill="#8B6914" stroke="#5c4610" stroke-width="1.5"/>
  <!-- shelves -->
  <line x1="30" y1="60" x2="80" y2="60" stroke="#5c4610" stroke-width="1"/>
  <line x1="30" y1="90" x2="80" y2="90" stroke="#5c4610" stroke-width="1"/>
  <line x1="30" y1="120" x2="80" y2="120" stroke="#5c4610" stroke-width="1"/>
  <line x1="220" y1="60" x2="270" y2="60" stroke="#5c4610" stroke-width="1"/>
  <line x1="220" y1="90" x2="270" y2="90" stroke="#5c4610" stroke-width="1"/>
  <line x1="220" y1="120" x2="270" y2="120" stroke="#5c4610" stroke-width="1"/>
  <!-- books -->
  <rect x="35" y="35" width="8" height="22" fill="#4a1c2e"/><rect x="45" y="38" width="6" height="19" fill="#2c4a3e"/>
  <rect x="55" y="33" width="10" height="24" fill="#5c4610"/><rect x="68" y="36" width="7" height="21" fill="#8B6914"/>
  <!-- window seat -->
  <rect x="85" y="100" width="130" height="50" fill="#8B6914" stroke="#5c4610" stroke-width="2"/>
  <rect x="90" y="60" width="120" height="45" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <line x1="150" y1="60" x2="150" y2="105" stroke="#5c4610" stroke-width="1"/>
  <!-- cushion -->
  <rect x="90" y="105" width="120" height="20" rx="3" fill="#4a1c2e" opacity="0.7"/>
</svg>