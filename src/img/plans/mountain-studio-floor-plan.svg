<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#faf7f2"/>
  <text x="200" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#4a1c2e">The Mountain Studio — Floor Plan (16' × 12')</text>
  <rect x="80" y="50" width="240" height="180" fill="#f5f0e6" stroke="#4a1c2e" stroke-width="3"/>
  <!-- french doors -->
  <rect x="155" y="227" width="30" height="6" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <rect x="190" y="227" width="30" height="6" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <path d="M155,227 A30,30 0 0,0 185,197" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="3"/>
  <path d="M220,227 A30,30 0 0,1 190,197" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="3"/>
  <!-- side windows -->
  <rect x="77" y="110" width="6" height="35" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <rect x="317" y="110" width="6" height="35" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <!-- electrical panel -->
  <rect x="90" y="60" width="15" height="20" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <text x="97" y="73" text-anchor="middle" font-size="5" fill="#666">Panel</text>
  <text x="200" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a1c2e">OPEN STUDIO</text>
  <text x="200" y="162" text-anchor="middle" font-size="9" fill="#7a6a5a">16' × 12' — 192 sq ft</text>
  <text x="200" y="178" text-anchor="middle" font-size="9" fill="#7a6a5a">11' vaulted ceiling</text>
  <line x1="80" y1="245" x2="320" y2="245" stroke="#999" stroke-width="0.5"/>
  <text x="200" y="260" text-anchor="middle" font-size="9" fill="#666">16'-0"</text>
  <line x1="340" y1="50" x2="340" y2="230" stroke="#999" stroke-width="0.5"/>
  <text x="355" y="145" text-anchor="middle" font-size="9" fill="#666" transform="rotate(90 355 145)">12'-0"</text>
</svg>