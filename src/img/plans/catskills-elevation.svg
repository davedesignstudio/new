<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340">
  <rect width="500" height="340" fill="#faf7f2"/>
  <text x="250" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#4a1c2e">The Catskills Cottage — Front Elevation</text>
  <!-- ground -->
  <line x1="30" y1="290" x2="470" y2="290" stroke="#3d5c3a" stroke-width="2"/>
  <text x="250" y="310" text-anchor="middle" font-size="9" fill="#7a6a5a">Grade — typical Catskills mountain site</text>
  <!-- foundation -->
  <rect x="100" y="275" width="300" height="15" fill="#888" stroke="#555" stroke-width="1"/>
  <!-- house body -->
  <rect x="110" y="155" width="280" height="120" fill="#8B6914" stroke="#5c4610" stroke-width="2"/>
  <!-- siding lines -->
  <line x1="110" y1="175" x2="390" y2="175" stroke="#5c4610" stroke-width="0.3" opacity="0.4"/>
  <line x1="110" y1="195" x2="390" y2="195" stroke="#5c4610" stroke-width="0.3" opacity="0.4"/>
  <line x1="110" y1="215" x2="390" y2="215" stroke="#5c4610" stroke-width="0.3" opacity="0.4"/>
  <line x1="110" y1="235" x2="390" y2="235" stroke="#5c4610" stroke-width="0.3" opacity="0.4"/>
  <line x1="110" y1="255" x2="390" y2="255" stroke="#5c4610" stroke-width="0.3" opacity="0.4"/>
  <!-- main roof -->
  <polygon points="90,155 250,55 410,155" fill="#4a1c2e" stroke="#2d1119" stroke-width="2"/>
  <!-- fish scale detail -->
  <path d="M130,130 Q160,115 190,130 Q220,115 250,130 Q280,115 310,130 Q340,115 370,130" fill="none" stroke="#2d1119" stroke-width="0.4" opacity="0.4"/>
  <!-- dormer -->
  <polygon points="210,100 250,70 290,100" fill="#5c2030" stroke="#2d1119" stroke-width="1.5"/>
  <rect x="225" y="100" width="50" height="35" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <line x1="250" y1="100" x2="250" y2="135" stroke="#5c4610" stroke-width="0.8"/>
  <line x1="225" y1="117" x2="275" y2="117" stroke="#5c4610" stroke-width="0.8"/>
  <!-- bay window -->
  <polygon points="155,275 155,210 185,195 215,210 215,275" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <line x1="185" y1="195" x2="185" y2="275" stroke="#5c4610" stroke-width="0.8"/>
  <!-- front door -->
  <rect x="300" y="220" width="45" height="55" fill="#4a1c2e" stroke="#2d1119" stroke-width="1.5"/>
  <circle cx="337" cy="250" r="3" fill="#b8860b"/>
  <!-- window -->
  <rect x="330" y="175" width="40" height="35" fill="#a8d4f0" stroke="#5c4610" stroke-width="1.5"/>
  <line x1="350" y1="175" x2="350" y2="210" stroke="#5c4610" stroke-width="0.8"/>
  <line x1="330" y1="192" x2="370" y2="192" stroke="#5c4610" stroke-width="0.8"/>
  <!-- porch -->
  <rect x="285" y="270" width="80" height="6" fill="#5c4610"/>
  <rect x="290" y="276" width="8" height="14" fill="#5c4610"/>
  <rect x="352" y="276" width="8" height="14" fill="#5c4610"/>
  <rect x="285" y="262" width="80" height="4" fill="#5c4610"/>
  <!-- chimney -->
  <rect x="340" y="65" width="22" height="55" fill="#8B4513" stroke="#5c2e0a" stroke-width="1"/>
  <rect x="335" y="62" width="32" height="5" fill="#5c2e0a"/>
  <!-- trim -->
  <line x1="90" y1="155" x2="410" y2="155" stroke="#b8860b" stroke-width="2"/>
  <!-- dimensions -->
  <line x1="110" y1="300" x2="390" y2="300" stroke="#999" stroke-width="0.5"/>
  <text x="250" y="325" text-anchor="middle" font-size="10" fill="#666">24'-0" overall width</text>
  <line x1="70" y1="55" x2="70" y2="290" stroke="#999" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="55" y="175" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90 55 175)">22'-0" ridge</text>
  <!-- snow load note -->
  <rect x="380" y="40" width="100" height="40" rx="3" fill="#fff" stroke="#b8860b" stroke-width="1"/>
  <text x="430" y="55" text-anchor="middle" font-size="8" fill="#4a1c2e" font-weight="bold">60 psf</text>
  <text x="430" y="67" text-anchor="middle" font-size="7" fill="#7a6a5a">snow load</text>
  <text x="430" y="77" text-anchor="middle" font-size="7" fill="#7a6a5a">Zone 6A</text>
</svg>