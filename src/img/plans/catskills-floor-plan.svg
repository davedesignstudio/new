<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <rect width="480" height="320" fill="#faf7f2"/>
  <text x="240" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#4a1c2e">The Catskills Cottage — Floor Plan (24' × 14')</text>
  <text x="240" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#7a6a5a">Scale: 1/4" = 1'-0"  |  336 sq ft main + 120 sq ft loft</text>
  <!-- exterior walls -->
  <rect x="60" y="50" width="360" height="210" fill="#f5f0e6" stroke="#4a1c2e" stroke-width="3"/>
  <!-- interior walls -->
  <line x1="60" y1="110" x2="180" y2="110" stroke="#4a1c2e" stroke-width="2"/>
  <line x1="180" y1="50" x2="180" y2="170" stroke="#4a1c2e" stroke-width="2"/>
  <line x1="60" y1="170" x2="300" y2="170" stroke="#4a1c2e" stroke-width="2"/>
  <line x1="300" y1="110" x2="300" y2="260" stroke="#4a1c2e" stroke-width="2"/>
  <line x1="300" y1="110" x2="420" y2="110" stroke="#4a1c2e" stroke-width="2"/>
  <!-- door swings -->
  <path d="M60,140 A30,30 0 0,1 90,110" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="4"/>
  <path d="M300,200 A25,25 0 0,0 325,175" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="4"/>
  <!-- windows -->
  <rect x="200" y="47" width="50" height="6" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <rect x="350" y="47" width="40" height="6" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <rect x="417" y="130" width="6" height="40" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <rect x="200" y="257" width="40" height="6" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <!-- bay window -->
  <polygon points="240,260 260,275 280,260" fill="#a8d4f0" stroke="#4a1c2e" stroke-width="1"/>
  <!-- fixtures -->
  <rect x="70" y="60" width="30" height="20" rx="2" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <text x="85" y="73" text-anchor="middle" font-size="7" fill="#666">Bench</text>
  <rect x="310" y="60" width="25" height="20" rx="1" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <rect x="340" y="60" width="30" height="20" rx="1" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <text x="370" y="73" text-anchor="middle" font-size="7" fill="#666">Range</text>
  <rect x="310" y="120" width="20" height="15" rx="1" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <ellipse cx="380" cy="200" rx="15" ry="10" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <text x="380" y="203" text-anchor="middle" font-size="6" fill="#666">WC</text>
  <rect x="350" y="185" width="20" height="20" rx="1" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <text x="360" y="198" text-anchor="middle" font-size="6" fill="#666">Shwr</text>
  <!-- labels -->
  <text x="120" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4a1c2e">MUDROOM</text>
  <text x="120" y="107" text-anchor="middle" font-size="8" fill="#7a6a5a">5' × 6'</text>
  <text x="240" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4a1c2e">KITCHEN</text>
  <text x="240" y="107" text-anchor="middle" font-size="8" fill="#7a6a5a">8' × 10'</text>
  <text x="240" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#4a1c2e">LIVING</text>
  <text x="240" y="228" text-anchor="middle" font-size="8" fill="#7a6a5a">10' × 12'</text>
  <text x="360" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#4a1c2e">BATH</text>
  <text x="360" y="167" text-anchor="middle" font-size="8" fill="#7a6a5a">5' × 7'</text>
  <text x="330" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#4a1c2e">STORAGE</text>
  <!-- loft dashed -->
  <rect x="120" y="55" width="240" height="50" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="240" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#b8860b">SLEEPING LOFT (above)</text>
  <!-- ladder -->
  <line x1="175" y1="175" x2="175" y2="105" stroke="#b8860b" stroke-width="2"/>
  <line x1="170" y1="115" x2="180" y2="115" stroke="#b8860b" stroke-width="1"/>
  <line x1="170" y1="130" x2="180" y2="130" stroke="#b8860b" stroke-width="1"/>
  <line x1="170" y1="145" x2="180" y2="145" stroke="#b8860b" stroke-width="1"/>
  <line x1="170" y1="160" x2="180" y2="160" stroke="#b8860b" stroke-width="1"/>
  <!-- dimensions -->
  <line x1="60" y1="275" x2="420" y2="275" stroke="#999" stroke-width="0.5"/>
  <line x1="60" y1="270" x2="60" y2="280" stroke="#999" stroke-width="0.5"/>
  <line x1="420" y1="270" x2="420" y2="280" stroke="#999" stroke-width="0.5"/>
  <text x="240" y="290" text-anchor="middle" font-size="9" fill="#666">24'-0"</text>
  <line x1="440" y1="50" x2="440" y2="260" stroke="#999" stroke-width="0.5"/>
  <text x="455" y="160" text-anchor="middle" font-size="9" fill="#666" transform="rotate(90 455 160)">14'-0"</text>
  <!-- north arrow -->
  <polygon points="30,70 35,85 25,85" fill="#4a1c2e"/>
  <text x="30" y="95" text-anchor="middle" font-size="8" fill="#4a1c2e">N</text>
</svg>