<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boonton Cafe diner tour</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var LOOP = 14;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1520);
  scene.fog = new THREE.Fog(0x1a1520, 12, 28);

  var camera = new THREE.PerspectiveCamera(58, 16 / 9, 0.1, 80);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var cherry = 0xc41e3a;
  var cherryDark = 0x8e1028;
  var chromeCol = 0xc5c8ce;
  var cream = 0xf6e4c3;
  var cyan = 0x3de0ff;
  var pink = 0xff4f9a;

  function mat(color, opts) {
    opts = opts || {};
    return new THREE.MeshPhongMaterial({
      color: color,
      shininess: opts.shine || 40,
      specular: opts.spec || 0x333333,
      emissive: opts.emis || 0x000000,
      emissiveIntensity: opts.ei || 1
    });
  }

  function chromeMat() {
    return new THREE.MeshPhongMaterial({
      color: chromeCol,
      shininess: 140,
      specular: 0xffffff
    });
  }

  function checkerTex() {
    var s = 512;
    var c = document.createElement("canvas");
    c.width = c.height = s;
    var g = c.getContext("2d");
    var n = 8, t = s / n, i, j;
    for (j = 0; j < n; j++) {
      for (i = 0; i < n; i++) {
        g.fillStyle = (i + j) % 2 === 0 ? "#f4f4f1" : "#141414";
        g.fillRect(i * t, j * t, t, t);
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(18, 14);
    tex.anisotropy = 8;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function addBox(w, h, d, material, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    m.position.set(x, y, z);
    scene.add(m);
    return m;
  }

  function addCyl(rTop, rBot, h, material, x, y, z, rx) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 24), material);
    m.position.set(x, y, z);
    if (rx) m.rotation.x = rx;
    scene.add(m);
    return m;
  }

  var vinyl = mat(cherry, { shine: 90, spec: 0x662222 });
  var vinylDark = mat(cherryDark, { shine: 80 });
  var whiteLam = mat(0xf3f1ea, { shine: 70, spec: 0x888888 });
  var wallW = mat(0xf7f4ee, { shine: 12 });
  var ceilM = mat(0x6d6a70, { shine: 8 });
  var chrome = chromeMat();

  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(18, 16),
    new THREE.MeshPhongMaterial({
      map: checkerTex(),
      shininess: 120,
      specular: 0x666666
    })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  addBox(18, 4.1, 0.25, wallW, 0, 2.05, -7.7);
  addBox(18, 4.1, 0.25, wallW, 0, 2.05, 7.7);
  addBox(0.25, 4.1, 16, wallW, -8.9, 2.05, 0);
  addBox(0.25, 4.1, 16, wallW, 8.9, 2.05, 0);
  addBox(18, 1.15, 0.28, vinyl, 0, 0.57, -7.68);
  addBox(18, 1.15, 0.28, vinyl, 0, 0.57, 7.68);
  addBox(0.28, 1.15, 16, vinyl, -8.88, 0.57, 0);
  addBox(0.28, 1.15, 16, vinyl, 8.88, 0.57, 0);
  addBox(17.6, 0.12, 16, ceilM, 0, 4.15, 0);

  var trim = mat(0x111111);
  addBox(17.7, 0.08, 0.08, trim, 0, 1.2, -7.55);
  addBox(17.7, 0.08, 0.08, mat(cherry), 0, 1.28, -7.55);

  function booth(z) {
    addBox(1.7, 1.05, 1.55, vinyl, 7.35, 0.52, z - 0.85);
    addBox(1.7, 1.05, 1.55, vinyl, 7.35, 0.52, z + 0.85);
    addBox(1.7, 0.9, 0.16, vinylDark, 7.35, 1.5, z - 1.55);
    addBox(1.7, 0.9, 0.16, vinylDark, 7.35, 1.5, z + 1.55);
    addBox(1.55, 0.08, 1.45, whiteLam, 7.3, 1.08, z);
    addCyl(0.06, 0.06, 1.05, chrome, 7.3, 0.54, z, 0);
    var cone = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.32, 16), mat(cherry, { shine: 100, emis: 0x4a0008, ei: 0.35 }));
    cone.position.set(7.3, 2.55, z);
    scene.add(cone);
    var p = new THREE.PointLight(0xff8866, 0.32, 5);
    p.position.set(7.3, 2.35, z);
    scene.add(p);
  }
  booth(3.4);
  booth(0.15);
  booth(-3.1);

  function table(x, z) {
    addCyl(0.62, 0.62, 0.07, whiteLam, x, 1.05, z, 0);
    addCyl(0.07, 0.07, 1.02, chrome, x, 0.52, z, 0);
    addCyl(0.28, 0.28, 0.05, chrome, x, 0.04, z, 0);
    var k;
    for (k = 0; k < 4; k++) {
      var a = (k * Math.PI) / 2 + 0.4;
      var cx = x + Math.cos(a) * 0.85;
      var cz = z + Math.sin(a) * 0.85;
      addCyl(0.22, 0.22, 0.08, vinyl, cx, 0.62, cz, 0);
      addCyl(0.03, 0.03, 0.62, chrome, cx, 0.31, cz, 0);
      addBox(0.32, 0.38, 0.05, vinyl, cx, 0.88, cz);
    }
    addCyl(0.05, 0.05, 0.16, mat(0xc41e3a), x + 0.12, 1.16, z + 0.1, 0);
    addCyl(0.05, 0.05, 0.16, mat(0xe0b000), x + 0.22, 1.16, z + 0.05, 0);
  }
  table(-0.2, 2.1);
  table(1.15, -0.6);
  table(-0.4, -3.15);

  addBox(1.55, 1.08, 10.4, vinyl, -6.55, 0.54, 0.2);
  addBox(1.7, 0.08, 10.5, whiteLam, -6.5, 1.1, 0.2);
  addBox(0.08, 0.05, 10.2, chrome, -5.78, 0.72, 0.2);
  addBox(0.08, 0.05, 10.2, chrome, -5.78, 0.5, 0.2);
  addBox(0.08, 0.05, 10.2, chrome, -5.78, 0.28, 0.2);
  addBox(1.9, 0.16, 10.6, vinylDark, -6.55, 2.72, 0.2);
  addBox(1.7, 0.04, 10.4, mat(cyan, { emis: cyan, ei: 0.7, shine: 10 }), -6.4, 2.62, 0.2);

  var si;
  for (si = 0; si < 8; si++) {
    var sz = -4.2 + si * 1.2;
    addCyl(0.2, 0.22, 0.08, vinyl, -5.35, 0.66, sz, 0);
    addCyl(0.035, 0.035, 0.66, chrome, -5.35, 0.32, sz, 0);
    addCyl(0.18, 0.18, 0.04, chrome, -5.35, 0.03, sz, 0);
  }

  addBox(0.7, 1.4, 0.45, mat(cherryDark, { shine: 60 }), -6.7, 1.85, -3.6);
  addCyl(0.28, 0.28, 0.12, whiteLam, -6.55, 1.28, -2.6, 0);
  addBox(0.35, 0.45, 0.35, mat(0x3a6ea5, { shine: 80 }), -6.8, 1.55, -1.8);

  var jb = new THREE.Group();
  jb.position.set(0.15, 0, -6.85);
  var jbBody = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.7, 0.7), mat(0x222226, { shine: 80 }));
  jbBody.position.y = 0.85;
  jb.add(jbBody);
  var jbTop = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.7, 0.55), mat(0xc9a227, { shine: 90, emis: 0x332200, ei: 0.25 }));
  jbTop.position.y = 1.85;
  jb.add(jbTop);
  var cols = [0xff3366, 0x33ddff, 0xffcc33, 0x66ff99];
  var ci;
  for (ci = 0; ci < 4; ci++) {
    var panel = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.55, 0.04),
      mat(cols[ci], { emis: cols[ci], ei: 0.85, shine: 20 })
    );
    panel.position.set(-0.36 + ci * 0.24, 1.85, 0.3);
    jb.add(panel);
  }
  scene.add(jb);
  var jbLight = new THREE.PointLight(0xff66aa, 0.7, 7);
  jbLight.position.set(0.15, 2.1, -6.2);
  scene.add(jbLight);

  function neonTube(points, color, radius) {
    var curve = new THREE.CatmullRomCurve3(points);
    var geo = new THREE.TubeGeometry(curve, 64, radius || 0.045, 8, false);
    var mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 1,
      shininess: 10
    }));
    scene.add(mesh);
    return mesh;
  }
  neonTube([
    new THREE.Vector3(-6, 3.85, 5),
    new THREE.Vector3(-3.2, 3.95, 3.2),
    new THREE.Vector3(-1, 3.8, 1),
    new THREE.Vector3(1.4, 3.95, -1.4),
    new THREE.Vector3(4, 3.82, -3.5),
    new THREE.Vector3(6.4, 3.92, -5.5)
  ], pink, 0.05);
  neonTube([
    new THREE.Vector3(6.2, 3.85, 5.2),
    new THREE.Vector3(3.4, 3.92, 2.8),
    new THREE.Vector3(0.6, 3.8, 0.4),
    new THREE.Vector3(-2, 3.95, -2.2),
    new THREE.Vector3(-5.2, 3.84, -5)
  ], cyan, 0.05);

  var hemi = new THREE.HemisphereLight(0xffe8d2, 0x223344, 0.55);
  scene.add(hemi);
  var key = new THREE.DirectionalLight(0xfff2dd, 0.45);
  key.position.set(-4, 8, 6);
  scene.add(key);
  var fill = new THREE.PointLight(0xff4f7a, 0.16, 18);
  fill.position.set(2, 3.2, 2);
  scene.add(fill);
  var fill2 = new THREE.PointLight(0x3de0ff, 0.3, 16);
  fill2.position.set(-3, 3.4, -2);
  scene.add(fill2);
  var soffitL = new THREE.PointLight(0xffccaa, 0.55, 10);
  soffitL.position.set(-6.2, 2.5, 0.2);
  scene.add(soffitL);

  function signTex() {
    var c = document.createElement("canvas");
    c.width = 1024;
    c.height = 256;
    var g = c.getContext("2d");
    g.clearRect(0, 0, 1024, 256);
    g.font = "italic 92px Georgia, serif";
    g.fillStyle = "#4ad7ff";
    g.shadowColor = "#3de0ff";
    g.shadowBlur = 18;
    g.fillText("Boonton", 70, 120);
    g.font = "italic 110px Georgia, serif";
    g.fillStyle = "#ff6aa8";
    g.shadowColor = "#ff4f9a";
    g.fillText("Cafe", 430, 200);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  var sign = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 0.9),
    new THREE.MeshBasicMaterial({ map: signTex(), transparent: true })
  );
  sign.position.set(-3.4, 3.15, -7.52);
  scene.add(sign);

  var clockC = document.createElement("canvas");
  clockC.width = clockC.height = 256;
  var cg = clockC.getContext("2d");
  cg.fillStyle = "#f6e4c3";
  cg.beginPath();
  cg.arc(128, 128, 120, 0, Math.PI * 2);
  cg.fill();
  cg.strokeStyle = "#171417";
  cg.lineWidth = 10;
  cg.stroke();
  cg.fillStyle = "#171417";
  var h;
  for (h = 0; h < 12; h++) {
    var ang = (h / 12) * Math.PI * 2;
    cg.beginPath();
    cg.arc(128 + Math.sin(ang) * 88, 128 - Math.cos(ang) * 88, 4, 0, Math.PI * 2);
    cg.fill();
  }
  cg.strokeStyle = "#c41e3a";
  cg.lineWidth = 6;
  cg.beginPath();
  cg.moveTo(128, 128);
  cg.lineTo(128, 55);
  cg.stroke();
  cg.strokeStyle = "#171417";
  cg.lineWidth = 4;
  cg.beginPath();
  cg.moveTo(128, 128);
  cg.lineTo(185, 128);
  cg.stroke();
  var clockTex = new THREE.CanvasTexture(clockC);
  var clock = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 32),
    new THREE.MeshBasicMaterial({ map: clockTex })
  );
  clock.position.set(2.3, 3.35, -7.52);
  scene.add(clock);

  var posPts = [
    new THREE.Vector3(0.15, 1.62, 6.5),
    new THREE.Vector3(0.4, 1.58, 3.4),
    new THREE.Vector3(-2.4, 1.52, 2.0),
    new THREE.Vector3(-2.8, 1.5, -0.2),
    new THREE.Vector3(-0.6, 1.54, -2.2),
    new THREE.Vector3(1.8, 1.56, -1.4),
    new THREE.Vector3(2.2, 1.58, -3.6),
    new THREE.Vector3(0.2, 1.6, -4.8),
    new THREE.Vector3(0.2, 1.6, 1.4),
    new THREE.Vector3(0.15, 1.62, 6.5)
  ];
  var lookPts = [
    new THREE.Vector3(0.1, 1.3, -2.4),
    new THREE.Vector3(-5.4, 1.15, 0.8),
    new THREE.Vector3(-6.3, 1.18, 0.2),
    new THREE.Vector3(-5.6, 1.12, -3.0),
    new THREE.Vector3(6.4, 1.2, -1.0),
    new THREE.Vector3(7.1, 1.15, -3.2),
    new THREE.Vector3(0.2, 1.45, -6.7),
    new THREE.Vector3(0.15, 1.55, -6.8),
    new THREE.Vector3(0.2, 1.35, -2.0),
    new THREE.Vector3(0.1, 1.3, -2.4)
  ];
  var posCurve = new THREE.CatmullRomCurve3(posPts, true, "catmullrom", 0.12);
  var lookCurve = new THREE.CatmullRomCurve3(lookPts, true, "catmullrom", 0.12);

  function poseAt(t) {
    var u = (t / LOOP) % 1;
    if (u < 0) u += 1;
    var p = posCurve.getPoint(u);
    var l = lookCurve.getPoint(u);
    camera.position.copy(p);
    camera.lookAt(l);
  }

  window.__dinerReady = false;
  window.__renderAt = function (t) {
    poseAt(t);
    renderer.render(scene, camera);
  };

  function onResize() {
    camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", onResize);

  var start = performance.now();
  function tick(now) {
    window.__renderAt((now - start) / 1000);
    requestAnimationFrame(tick);
  }

  poseAt(0);
  renderer.render(scene, camera);
  window.__dinerReady = true;
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
