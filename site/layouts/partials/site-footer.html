<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="footer-col footer-brand">
      <p class="footer-om" lang="sa" aria-hidden="true">ॐ</p>
      <p class="footer-name">{{ .Site.Title }}</p>
      <p class="footer-tagline">{{ .Site.Params.description }}</p>
    </div>
    <div class="footer-col">
      <h4>Visit</h4>
      <p>{{ .Site.Params.address }}</p>
      <p>{{ .Site.Params.phone }}</p>
    </div>
    <div class="footer-col">
      <h4>Hours</h4>
      <p>{{ .Site.Params.hours }}</p>
      <p>Kitchen closes at 22:00</p>
    </div>
  </div>
  <p class="footer-fine">Lagom · <span lang="ja">間</span> · <span lang="sa">सत्त्व</span> — balance in every bowl</p>
</footer>
