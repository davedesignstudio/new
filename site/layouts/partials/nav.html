{{ $cur := .RelPermalink }}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="{{ .Site.BaseURL }}">
      <span class="wordmark__mark" aria-hidden="true">
        <span class="wordmark__bar"></span>
        <span class="wordmark__bar"></span>
        <span class="wordmark__bar"></span>
      </span>
      <span class="wordmark__text">
        <strong>Three Branches</strong>
        <small>of the U.S. Government</small>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="nav-toggle__box" aria-hidden="true"></span>
      <span class="nav-toggle__label">Menu</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      {{ range .Site.Menus.main }}
        <a class="site-nav__link{{ if or (eq $cur .URL) (hasPrefix $cur .URL) }} is-current{{ end }}"
           href="{{ .URL }}"{{ if eq $cur .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
