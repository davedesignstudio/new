<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ if .IsHome }}
  <title>{{ .Site.Title }} — Graphic Design, North Jersey</title>
  {{ else }}
  <title>{{ .Title }} — {{ .Site.Title }}</title>
  {{ end }}
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/img/favicon.png">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/img/apple-touch-icon-144-precomposed.png">
</head>
<body class="{{ if .IsHome }}is-home{{ end }}{{ with .Section }} section-{{ . | urlize }}{{ end }} page-{{ .Title | urlize }}">
  <a class="skip-link" href="#main">Skip to work</a>
  <header class="site-header">
    <div class="site-header__bar">
      <a class="wordmark" href="/">
        <span class="wordmark__name">D Philhower</span>
        <span class="wordmark__studio">Studio</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle__label">Menu</span>
        <span class="nav-toggle__marks" aria-hidden="true"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <ul>
          {{ range .Site.Menus.main }}
          <li>
            <a href="{{ .URL }}"{{ if or (eq $.RelPermalink .URL) (and (eq .Name "Work") (eq $.Section "work")) }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
          {{ end }}
        </ul>
      </nav>
    </div>
  </header>
