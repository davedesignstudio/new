<!DOCTYPE html>
<html lang="{{ with .Site.LanguageCode }}{{ . }}{{ else }}en{{ end }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ .Hugo.Generator }}
  {{ if .IsHome }}
  <title>{{ .Site.Title }} · Bernardsville, NJ</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="shortcut icon" href="/img/favicon.png">
</head>
<body class="page{{ if .IsHome }} page-home{{ end }}{{ with .Section }} section-{{ . | urlize }}{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-header>
    <div class="site-header__inner">
      <a class="brand" href="/">
        <span class="brand__script">Bville</span>
        <span class="brand__rest">Pizza &amp; Grill</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
        <span class="nav-toggle__label">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" data-nav>
        <a href="/menu">Menu</a>
        <a href="/gallery">Gallery</a>
        <a href="/visit">Visit</a>
        <a class="site-nav__phone" href="{{ .Site.Params.phoneHref | safeURL }}">{{ .Site.Params.phone }}</a>
      </nav>
    </div>
  </header>
