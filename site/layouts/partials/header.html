<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{with .Site.LanguageCode}} xml:lang="{{.}}" lang="{{.}}"{{end}}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ .Hugo.Generator }}

  {{ if .IsHome }}
  <title>{{ .Site.Title }} — {{ .Site.Params.tagline }}</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}

  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon-144-precomposed.png">
</head>
<body class="{{ if .IsHome }}home{{ else }}page {{ .Params.branch | default .Section | urlize }}{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <div class="site-header-inner">
      <a class="brand" href="/" aria-label="Three Branches home">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <polygon points="24,4 44,40 4,40" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <circle cx="24" cy="16.5" r="2.2" fill="currentColor"/>
          <circle cx="13.5" cy="34.5" r="2.2" fill="currentColor"/>
          <circle cx="34.5" cy="34.5" r="2.2" fill="currentColor"/>
        </svg>
        <span class="brand-text">
          <span class="brand-kicker">A civic field guide</span>
          <span class="brand-name">Three Branches</span>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a href="/#branches">Overview</a>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
        <a class="nav-cta" href="/#quiz">Quiz</a>
      </nav>
    </div>
  </header>
