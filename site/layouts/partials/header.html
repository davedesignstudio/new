<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ .Hugo.Generator }}

  {{ if .IsHome }}
  <title>{{ .Site.Title }} &middot; A Guide to the U.S. Federal Government</title>
  {{ else }}
  <title>{{ .Title }} &middot; {{ .Site.Title }}</title>
  {{ end }}

  <meta name="description" content="{{ .Params.blurb | default .Site.Params.description }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Params.blurb | default .Site.Params.description }}">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/img/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="/img/favicon.png">
  {{ with .OutputFormats.Get "RSS" }}
  <link href="{{ .Permalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}">
  {{ end }}
</head>
<body class="page-{{ if .IsHome }}home{{ else }}{{ .Title | urlize }}{{ end }}">

<a class="skip-link" href="#main">Skip to main content</a>

{{ partial "nav" . }}

<main id="main">
