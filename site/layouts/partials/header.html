<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{with .Site.LanguageCode}} xml:lang="{{.}}" lang="{{.}}"{{end}}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ .Hugo.Generator }}

  {{ if .IsHome }}
  <title>{{ .Site.Title }} — {{ .Site.Params.tagline }}</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cormorant+Garamond:500,600,700|Source+Sans+Pro:400,600,700|IBM+Plex+Mono:400,500">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="/img/favicon.png">
  {{ with .RSSLink }}<link href="{{ . }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" />{{ end }}
</head>
<body class="{{ if .IsHome }}is-home{{ end }} {{ .Section | urlize }}">
<header class="site-header">
  <a class="brand" href="{{ .Site.BaseURL }}">
    <img src="/img/po-mark.png" alt="" class="brand-mark" width="48" height="48">
    <span class="brand-lockup">
      <span class="brand-name">Philhower <em>&amp;</em> Okrogly</span>
      <span class="brand-tag">{{ .Site.Params.tagline }}</span>
    </span>
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
    <span></span><span></span>
  </button>
  <nav id="site-nav" class="site-nav">
    <a href="/">Home</a>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
