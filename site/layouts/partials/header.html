<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{with .Site.LanguageCode}} xml:lang="{{.}}" lang="{{.}}"{{end}}{{ if or (eq .Params.layout "walkthrough") (eq .Params.layout "cafemenu") (eq .Params.bodyclass "is-menu") }} class="{{ if eq .Params.layout "walkthrough" }}has-scroll-walk{{ end }}{{ if or (eq .Params.layout "cafemenu") (eq .Params.bodyclass "is-menu") }} is-menu{{ end }}"{{ end }}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  {{ .Hugo.Generator }}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ if .IsHome }}
  <title>{{ .Site.Title }} · {{ .Site.Params.tagline }}</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@400;600&family=Montserrat:wght@500;700&family=Oswald:wght@500;700&family=Outfit:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@700&display=swap">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/img/brand/hills-seal.png">
  <link rel="shortcut icon" href="/img/brand/hills-seal.png">
</head>
<body class="{{ if .IsHome }}home{{ else }}{{ .Section | urlize }}{{ end }}{{ with .Params.bodyclass }} {{ . }}{{ end }}{{ if eq .Params.layout "walkthrough" }} has-scroll-walk{{ end }}">
<a class="skip-link" href="#main">Skip to the counter</a>
{{ if eq .Params.layout "walkthrough" }}
<video class="site-walk js-scroll-walk" muted playsinline preload="auto" poster="/img/walkthrough/diner-3d-still.jpg" aria-hidden="true">
  <source src="/videos/diner-walkthrough.mp4" type="video/mp4">
</video>
<div class="site-walk-scrim" aria-hidden="true"></div>
{{ end }}

<header class="header object-header">
  <div class="header-bar">
    <div class="container header-bar-inner">
      <a class="logo" href="/">
        <img class="logo-lockup" src="/img/brand/the-boonton-cafe.png" alt="The Boonton Cafe">
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="header-nav" id="site-nav" aria-label="Main">
        <a href="/" class="nav-link{{ if .IsHome }} is-active{{ end }}">Home</a>
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} is-active{{ end }}{{ if eq $.RelPermalink (printf "%s/" .URL) }} is-active{{ end }}">{{ .Name }}</a>
        {{ end }}
      </nav>
      <div class="header-actions">
        <a class="btn-sign-in" href="tel:+1{{ .Site.Params.phoneHref }}">Call</a>
        <a class="btn" href="{{ .Site.Params.orderUrl }}">Order</a>
      </div>
    </div>
  </div>
</header>
