<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{with .Site.LanguageCode}} xml:lang="{{.}}" lang="{{.}}"{{end}}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ .Hugo.Generator }}

  {{ if .IsHome }}
  <title>{{ .Site.Title }}</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}

  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/img/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="/img/favicon.png">
</head>
<body class="{{ if .IsHome }}is-home{{ end }} {{ .Section | urlize }}">

<div class="site-frame">
  {{ partial "services" . }}
  <div class="stage">
    {{ partial "brand" . }}
    <div class="stage-body">
      <div class="feature">
