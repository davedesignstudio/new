<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{ with .Site.LanguageCode }} xml:lang="{{.}}" lang="{{.}}"{{ end }}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ .Hugo.Generator }}

  {{ if .IsHome }}
  <title>{{ .Site.Title }}</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/img/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="/img/favicon.png">
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }} {{ .Section | urlize }}">
<a class="skip-link" href="#stage">Skip to content</a>
<div class="studio-shell">
{{ partial "sidebar" . }}
<div class="studio-main">
  <header class="studio-top">
    <a class="brand-lockup" href="{{ .Site.BaseURL }}">
      {{ partial "brand-mark.html" . }}
    </a>

    <nav class="studio-nav" aria-label="Primary">
      <a class="nav-link{{ if .IsHome }} is-active{{ end }}" href="/">Home</a>
      <a class="nav-link{{ if or (eq .Section "work") (eq .RelPermalink "/work/") }} is-active{{ end }}" href="/work/">Work</a>
      <a class="nav-cta{{ if in .RelPermalink "call-us" }} is-active{{ end }}" href="/call-us/">
        {{ partial "brush-icon.html" . }}
        <span>call us</span>
      </a>
      <div class="social">
        <span class="social-label">Social</span>
        <div class="social-dots">
          <a href="https://www.instagram.com/" class="social-dot" aria-label="Instagram"></a>
          <a href="https://www.behance.net/" class="social-dot" aria-label="Behance"></a>
          <a href="https://www.linkedin.com/" class="social-dot" aria-label="LinkedIn"></a>
        </div>
      </div>
    </nav>
  </header>
