<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{with .Site.LanguageCode}} xml:lang="{{.}}" lang="{{.}}"{{end}}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  {{ .Hugo.Generator }}
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  {{ if .IsHome }}
  <title>{{ .Site.Title }} — {{ .Site.Params.tagline }}</title>
  {{ else }}
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  {{ end }}

  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }} {{ .Params.theme }}">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="wordmark" href="/">
      <span class="wordmark__kicker">U.S. Constitution</span>
      <span class="wordmark__title">{{ .Site.Title }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <a href="/"{{ if .IsHome }} class="is-active"{{ end }}>Overview</a>
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"{{ if or (eq $.RelPermalink .URL) (eq $.URL .URL) }} class="is-active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
