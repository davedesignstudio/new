<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <a class="brand" href="{{ .Site.BaseURL }}">
        <span class="brand-mark">{{ partial "lotus" . }}</span>
        <h1>{{ .Site.Title }}</h1>
      </a>
      <p class="sanskrit brand-mantra">अन्नं ब्रह्म</p>
      <p class="lead">{{ .Site.Params.description | markdownify }}</p>
    </div>

    <ul class="sidebar-nav">
      <li><a href="/">Home</a> </li>
      {{ range .Site.Menus.main }}
        <li><a href="{{.URL}}"> {{ .Name }} </a></li>
      {{end}}
    </ul>

    <div class="sidebar-foot">
      <span class="shanti sanskrit">ॐ शान्तिः शान्तिः शान्तिः</span>
      <span class="foot-note">Lagom &middot; Wabi-sabi &middot; &#7770;ta</span>
    </div>
  </div>
</div>
