<header class="site-header">
  <a class="brand" href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} home">
    <span class="brand-mark" aria-hidden="true">ॐ</span>
    <span class="brand-name">{{ .Site.Title }}</span>
  </a>
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="/">Home</a>
    <a href="/food">Menu</a>
    <a href="/gallery">Journal</a>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <a class="nav-cta" href="/contact">Reserve <span aria-hidden="true">↗</span></a>
</header>
