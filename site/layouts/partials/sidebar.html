<header class="site-header">
  <a class="brand" href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} home">
    <span class="brand-mark" aria-hidden="true">ॐ</span>
    <span class="brand-name"><span>tasty</span> licks</span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="{{ if .IsHome }}active{{ end }}" href="/">Home</a>
    {{ range .Site.Menus.main }}
      <a class="{{ if eq $.RelPermalink .URL }}active{{ end }}" href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
  <a class="header-cta" href="/contact">Reserve a table <span aria-hidden="true">↗</span></a>
</header>
