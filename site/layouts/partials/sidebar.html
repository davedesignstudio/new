<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <p class="sidebar-kicker">Scandinavian calm · Japanese restraint · Vedic warmth</p>
      <a href="{{ .Site.BaseURL }}"><h1>{{ .Site.Title }}</h1></a>
      <p class="lead">{{ .Site.Params.description | markdownify }}</p>
    </div>

    <ul class="sidebar-nav">
      <li><a href="/">Home</a></li>
      {{ range .Site.Menus.main }}
        <li><a href="{{.URL}}">{{ .Name }}</a></li>
      {{end}}
    </ul>

    <div class="sidebar-note">
      <span class="sidebar-note-mark"></span>
      <p>Natural materials, quiet light, and ceremonial details shape every room.</p>
    </div>
  </div>
</div>
