<header class="site-header">
  <a class="brand" href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} home">
    <span class="brand-mark" aria-hidden="true">सो</span>
    <span class="brand-name">{{ .Site.Title }}</span>
    <span class="brand-place">Stockholm</span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="/food">Menu</a>
    {{ range .Site.Menus.main }}
      <a href="{{.URL}}">{{ .Name }}</a>
    {{end}}
  </nav>
  <a class="header-reserve" href="/contact">
    Reservations <span aria-hidden="true">↗</span>
  </a>
</header>
