<aside class="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-brand">
      <a class="om-mark" href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} — home"><span>ॐ</span></a>
      <h1 class="sidebar-title"><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
      <p class="sidebar-tagline">Nordic &middot; Japanese &middot; Vedic</p>
    </div>

    {{ $current := trim .RelPermalink "/" }}
    <nav aria-label="Main navigation">
      <ul class="sidebar-nav">
        <li><a href="/"{{ if .IsHome }} class="active"{{ end }}>Home</a></li>
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if eq $current (trim .URL "/") }} class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <div class="sidebar-foot">
      <p class="devanagari">अन्नं ब्रह्म</p>
      <p>Tue &ndash; Sun &middot; 17:00 &ndash; 23:00<br>14 Fjordgatan, Stockholm</p>
    </div>
  </div>
</aside>
