<header class="site-header">
  <a class="site-mark" href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} home">
    <span class="mark-symbol" aria-hidden="true">सो</span>
    <span class="mark-word">{{ .Site.Title }}</span>
  </a>

  <nav class="site-nav" aria-label="Main navigation">
    <ul>
      <li><a href="/food">Menu</a></li>
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>

  <a class="header-reserve" href="/contact">Reservations <span aria-hidden="true">↗</span></a>
</header>
