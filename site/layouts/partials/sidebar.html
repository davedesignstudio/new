<header class="site-header">
  <a class="wordmark" href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }} home">
    <span class="wordmark-symbol" aria-hidden="true">ॐ</span>
    <span>{{ .Site.Title }}</span>
  </a>

  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
    <span>Menu</span>
    <i aria-hidden="true"></i>
  </button>

  <nav id="site-nav" class="site-nav" aria-label="Main navigation">
    <a href="/">Home</a>
    {{ range .Site.Menus.main }}
      <a href="{{.URL}}">{{ .Name }}</a>
    {{end}}
  </nav>

  <a class="header-reserve" href="/contact">Reservations</a>
</header>
