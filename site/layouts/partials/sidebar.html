<div class="sidebar">
  <div class="container sidebar-sticky">

    <!-- OM symbol — Vedic sacred invocation -->
    <span class="sidebar-om" aria-hidden="true">ॐ</span>

    <div class="sidebar-about">
      <a href="{{ .Site.BaseURL }}"><h1>{{ .Site.Title }}</h1></a>
      <p class="lead">{{ .Site.Params.description | markdownify }}</p>
    </div>

    <!-- Saffron divider — Vedic / Japanese line motif -->
    <span class="sidebar-divider" aria-hidden="true"></span>

    <ul class="sidebar-nav">
      <li><a href="/">Home</a></li>
      {{ range .Site.Menus.main }}
        <li><a href="{{.URL}}">{{ .Name }}</a></li>
      {{end}}
    </ul>

    <!-- Subtle Vedic blessing text -->
    <p class="sidebar-footer" aria-hidden="true">शिवम् · Shivam · Shibui</p>

  </div>
</div>
