<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <p class="eyebrow">New Jersey dinner guide</p>
      <a href="{{ .Site.BaseURL }}"><h1>{{ .Site.Title }}</h1></a>
      <p class="lead">{{ .Site.Params.description }}</p>
    </div>

    <ul class="sidebar-nav">
      <li><a href="/">Home</a></li>
      {{ range .Site.Menus.main }}
        <li><a href="{{.URL}}">{{ .Name }}</a></li>
      {{end}}
    </ul>

    <p class="sidebar-regions">
      <a href="/dinners/#north-jersey">North</a>
      <a href="/dinners/#central-jersey">Central</a>
      <a href="/dinners/#shore-and-south">Shore &amp; South</a>
    </p>
  </div>
</div>
