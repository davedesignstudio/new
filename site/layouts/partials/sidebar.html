<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <p class="sidebar-kicker">Nordic calm &#183; Kyoto balance &#183; sacred warmth</p>
      <a href="{{ .Site.BaseURL }}"><h1>{{ .Site.Title }}</h1></a>
      <p class="lead">{{ .Site.Params.description | markdownify }}</p>
      <p class="sidebar-mantra">A modern dining space shaped with Swedish restraint, Japanese precision, and a subtle Vedic glow.</p>
    </div>

    <ul class="sidebar-nav">
      <li><a href="/">Home</a></li>
      {{ range .Site.Menus.main }}
        <li><a href="{{.URL}}">{{ .Name }}</a></li>
      {{end}}
    </ul>
  </div>
</div>
