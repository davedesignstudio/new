{{ define "main" }}
<header class="page-header">
  <div class="container">
    <p class="eyebrow">Work</p>
    <h1 class="page-header__title">Selected projects</h1>
    {{ with .Content }}<div class="page-header__intro prose">{{ . }}</div>{{ end }}
  </div>
</header>

<section class="section section--flush-top">
  <div class="container">
    <div class="work-grid">
      {{- range .Pages.ByWeight }}
      {{ partial "work-card" . }}
      {{- end }}
    </div>
  </div>
</section>

{{ partial "cta" . }}
{{ end }}
