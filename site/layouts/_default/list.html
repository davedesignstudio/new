{{ partial "header" . }}

<main id="main" class="page-wrap">
  <header class="page-hero">
    <p class="eyebrow">Index</p>
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="footer-links">
    {{ range .Pages }}
    <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</main>

{{ partial "footer" . }}
