{{ partial "header" . }}

<main id="main" class="page">
  <header class="page-hero">
    <p class="section-label">{{ .Params.label | default "Index" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>
  <div class="page-body">
    <ul class="index-list">
      {{ range .Pages }}
      <li>
        <a href="{{ .Permalink }}">
          <strong>{{ .Title }}</strong>
          {{ with .Description }}<span>{{ . }}</span>{{ end }}
        </a>
      </li>
      {{ end }}
    </ul>
  </div>
</main>

{{ partial "footer" . }}
