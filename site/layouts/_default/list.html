{{ partial "header" . }}

<main id="main" class="page">
  <header class="page-hero">
    <h1>{{ .Title }}</h1>
  </header>
  <article class="page-body">
    <ul>
      {{ range .Pages }}
      <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </article>
</main>

{{ partial "footer" . }}
