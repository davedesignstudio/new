{{ partial "header" . }}

<div class="content">
  <article class="page reveal">
    <h1 class="page-title">{{ .Title | default .Section }}</h1>
    <div class="page-body">
      {{ .Content }}
      <ul class="list-links">
        {{ range .Pages }}
          <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </div>
    <p class="page-back"><a href="/">&larr; Back to the three branches</a></p>
  </article>
</div>

{{ partial "footer" . }}
