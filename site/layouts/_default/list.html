{{ partial "header" . }}

<div class="content container {{ .Section | urlize }}">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ .Content }}
  <ul class="page-list">
    {{ range .Pages }}
      <li>
        <a href="{{ .URL }}">{{ .Title }}</a>
        {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
      </li>
    {{ end }}
  </ul>
</div>

{{ partial "footer" . }}
