{{ partial "header" . }}

{{ if eq .Section "work" }}
  <div class="work-board">
    <header class="page-heading">
      <h1>{{ .Title }}</h1>
      <p class="work-filter-status" data-filter-status>Selected projects across web, print, and campaigns.</p>
    </header>
    <div class="work-grid">
      {{ range .Data.Pages }}
      <a class="work-card" href="{{ .Permalink }}" data-category="{{ .Params.category }}">
        <span class="work-card-media">
          <img src="{{ .Params.image }}" alt="{{ .Title }}">
        </span>
        <span class="work-card-meta">
          <span class="work-card-cat">{{ .Params.label }}</span>
          <h2>{{ .Title }}</h2>
          <p>{{ .Params.summary }}</p>
        </span>
      </a>
      {{ end }}
    </div>
  </div>
{{ else }}
  <article class="page-copy">
    <header class="page-heading">
      <h1>{{ .Title }}</h1>
    </header>
    {{ .Content }}
  </article>
{{ end }}

{{ partial "footer" . }}
