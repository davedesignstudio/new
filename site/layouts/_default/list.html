{{ partial "header" . }}

<main id="main" class="page">
  <header class="page-hero">
    <p class="eyebrow">{{ .Title }}</p>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="work-grid">
    {{ range .Data.Pages }}
      {{ partial "work-card" . }}
    {{ end }}
  </div>
</main>

{{ partial "footer" . }}
