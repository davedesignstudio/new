{{ partial "header" . }}

<main id="main">
  <section class="object-poster object-poster-page object-poster-navy">
    <p class="object-brand">The house</p>
    <h1>About</h1>
    <figure class="object-figure">
      <img src="/img/plakat/coffee.png" alt="Coffee">
    </figure>
  </section>

  <div class="container page-wrap object-copy">
    <div class="object-copy-card">
      {{ .Content }}
    </div>
    <div class="about-marks">
      <div class="wordmark-panel">
        <p class="object-brand">From the sign</p>
        <img src="/img/brand/wordmark.png" alt="Boonton Cafe condensed wordmark">
      </div>
      <div class="wordmark-panel">
        <p class="object-brand">House seal</p>
        <img class="seal" src="/img/brand/hills-seal.png" alt="Boonton Cafe Serving the Hills circular seal">
      </div>
    </div>
  </div>
</main>

{{ partial "footer" . }}
