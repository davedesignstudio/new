{{ partial "header" . }}

<main id="main">
  <section class="object-hero object-hero-page">
    <div class="object-hero-type">
      <p class="object-kicker">The house</p>
      <p class="object-the">The</p>
      <h1>Boonton<br>Cafe</h1>
      <p class="object-product">About</p>
    </div>
    <figure class="object-hero-thing">
      <img src="/img/fifties/diner-waitress-coffee.jpg" alt="Waitress pouring coffee">
    </figure>
  </section>

  <div class="container page-wrap object-copy">
    <div class="object-copy-card">
      {{ .Content }}
    </div>
    <div class="about-marks">
      <div class="wordmark-panel">
        <p class="object-kicker">From the sign</p>
        <img src="/img/brand/wordmark.png" alt="Boonton Cafe condensed wordmark">
      </div>
      <div class="wordmark-panel">
        <p class="object-kicker">House seal</p>
        <img class="seal" src="/img/brand/hills-seal.png" alt="Boonton Cafe Serving the Hills circular seal">
      </div>
    </div>
  </div>
</main>

{{ partial "footer" . }}
