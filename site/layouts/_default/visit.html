{{ partial "header" . }}

<main id="main">
  <section class="object-poster object-poster-page">
    <p class="object-brand">Hawkins Place</p>
    <h1>Walk in</h1>
    <figure class="object-figure">
      <img src="/img/plakat/walkin.png" alt="Diner exterior">
    </figure>
    <p class="object-place">Patio · takeout · dine-in</p>
  </section>

  <div class="container page-wrap object-copy">
    <article class="object-copy-card">
      {{ .Content }}
      <dl class="object-facts">
        <div>
          <dt>Address</dt>
          <dd>{{ .Site.Params.address }}<br>{{ .Site.Params.city }}</dd>
        </div>
        <div>
          <dt>Phone</dt>
          <dd><a href="tel:+1{{ .Site.Params.phoneHref }}">{{ .Site.Params.phone }}</a></dd>
        </div>
        <div>
          <dt>Hours</dt>
          <dd>{{ .Site.Params.hours }}</dd>
        </div>
        <div>
          <dt>Room</dt>
          <dd>Dine-in · takeout · patio · delivery</dd>
        </div>
      </dl>
      <form name="boonton-table" netlify>
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Party size, time, or a note for the new owners" required></textarea>
        <button type="submit">Send to the house</button>
      </form>
    </article>
  </div>
</main>

{{ partial "footer" . }}
