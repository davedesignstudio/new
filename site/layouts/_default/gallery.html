{{ partial "header" . }}

<main id="main" class="interior">
  <header class="page-hero page-hero--gallery">
    <div class="page-hero__media">
      <img src="/img/bville/quesadilla.jpg" alt="Quesadilla plated at Bville" width="1600" height="1200">
    </div>
    <div class="page-hero__veil"></div>
    <div class="page-hero__content" data-reveal>
      <p class="eyebrow">From the listing</p>
      <h1>Gallery</h1>
      <p>Customer photos from the Bville Pizza &amp; Grill public listing — the dining room, plates, and the printed boards.</p>
    </div>
  </header>

  <div class="gallery">
    <figure class="gallery__item gallery__item--wide" data-reveal>
      <img src="/img/bville/dining.jpg" alt="Bright dining room with wood tables" width="1600" height="900">
      <figcaption>The dining room on Morristown Road</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/pizza.jpg" alt="Bville specialty pizza" width="1200" height="843">
      <figcaption>Specialty pizza</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/chicken-kabob.jpg" alt="Chicken kabob salad" width="1200" height="1600">
      <figcaption>Chicken kabob salad</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/falafel-salad.jpg" alt="Falafel salad with feta" width="1600" height="778">
      <figcaption>Falafel salad</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/falafel.jpg" alt="Falafel appetizer" width="1600" height="1200">
      <figcaption>Falafel with tahini</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/quesadilla.jpg" alt="Chicken quesadilla" width="1600" height="1200">
      <figcaption>Chicken quesadilla</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/pesto-chicken.jpg" alt="Chicken pesto cheese pull" width="1080" height="1080">
      <figcaption>Chicken pesto press</figcaption>
    </figure>
    <figure class="gallery__item" data-reveal>
      <img src="/img/bville/sandwich-fries.jpg" alt="Sandwich with fries" width="1600" height="1200">
      <figcaption>Sandwich &amp; fries</figcaption>
    </figure>
    <figure class="gallery__item gallery__item--wide" data-reveal>
      <img src="/img/bville/flyer.jpg" alt="Bville Pizza & Grill delivery flyer" width="778" height="1600">
      <figcaption>Delivery flyer — we deliver &amp; cater · BYOB</figcaption>
    </figure>
    <figure class="gallery__item gallery__item--wide" data-reveal>
      <img src="/img/bville/menu-board.jpg" alt="Tri-fold printed menu" width="1600" height="778">
      <figcaption>Printed menu boards</figcaption>
    </figure>
  </div>
</main>

{{ partial "footer" . }}
