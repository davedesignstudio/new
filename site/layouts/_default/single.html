{{ define "main" }}
<header class="page-header">
  <div class="container">
    <p class="eyebrow">{{ .Title }}</p>
    <h1 class="page-header__title">{{ .Params.lead | default .Title }}</h1>
  </div>
</header>
<section class="section section--flush-top">
  <div class="container">
    <div class="prose prose--narrow">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
