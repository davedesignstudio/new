{{ partial "header" . }}

<main id="main" class="content-wrap">
  {{ if .Params.image }}
  <figure class="page-hero">
    <img src="{{ .Params.image }}" alt="{{ with .Params.imageAlt }}{{ . }}{{ else }}{{ .Title }}{{ end }}">
  </figure>
  {{ end }}
  <article class="prose">
    <p class="eyebrow">{{ with .Params.eyebrow }}{{ . }}{{ else }}{{ .Section }}{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </article>
</main>

{{ partial "footer" . }}
