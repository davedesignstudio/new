{{ partial "header" . }}

<main id="main" class="page">
  <header class="page-hero">
    <p class="section-label">{{ .Params.label }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
  </header>
  <article class="page-body entry-content">
    {{ .Content }}
  </article>
</main>

{{ partial "footer" . }}
