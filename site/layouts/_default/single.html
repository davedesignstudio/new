{{ partial "header" . }}

<main id="main" class="page">
  <header class="page-hero">
    <p class="eyebrow">{{ .Title }}</p>
    <h1>{{ with .Params.headline }}{{ . }}{{ else }}{{ .Title }}{{ end }}</h1>
    {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <article class="page-body">
    {{ .Content }}
  </article>
</main>

{{ partial "footer" . }}
