{{ partial "header" . }}

<section class="page-hero">
  <div class="wrap">
    <h1 class="page-hero__title">{{ .Title }}</h1>
    {{ with .Params.blurb }}<p class="page-hero__lead">{{ . }}</p>{{ end }}
  </div>
</section>

<section class="section">
  <div class="wrap wrap--narrow">
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</section>

{{ partial "footer" . }}
