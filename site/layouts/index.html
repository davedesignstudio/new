{{ partial "header" . }}

<section class="showreel" aria-label="Studio showreel">
  <div class="showreel-glow" aria-hidden="true">
    <svg class="showreel-rays" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(0 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(20 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(40 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(60 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(80 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(100 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(120 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(140 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(160 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(180 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(200 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(220 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(240 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(260 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(280 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(300 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(320 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="-12" transform="rotate(340 50 50)"/>
    </svg>
  </div>

  <div class="showreel-frame">
    <video class="showreel-video" id="home_video" loop muted playsinline>
      <source src="/videos/SDVid.mp4" type="video/mp4">
      <source src="/videos/SDVid.ogg" type="video/ogg">
    </video>

    <div class="showreel-x" aria-hidden="true"></div>

    <button class="showreel-play" type="button" aria-controls="home_video">
      <span class="showreel-play-icon" aria-hidden="true"></span>
      <span class="showreel-caption">Video</span>
    </button>
  </div>
</section>

{{ partial "footer" . }}
