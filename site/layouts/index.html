{{ partial "header" . }}
{{ partial "sidebar" . }}

<main class="home">
  <section class="hero hero-photo" aria-label="WIDER opening">
    <img class="hero-still" src="/img/tower/ch1.jpg" alt="The Tower kitchen in a storm">
    <div class="hero-copy">
      <h1 class="hero-brand">{{ .Site.Title }}</h1>
      <p class="hero-line">{{ .Site.Params.tagline }}</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/play">Play</a>
        <a class="btn btn-ghost" href="/anthem">Anthem</a>
        <a class="btn btn-ghost" href="/play/?mars=1">Mars</a>
      </div>
    </div>
  </section>

  <nav class="frames" aria-label="Chapters">
    <a href="/play/"><img src="/img/tower/ch1.jpg" alt="Tower"></a>
    <a href="/play/"><img src="/img/tower/ch2.jpg" alt="Storm"></a>
    <a href="/play/"><img src="/img/tower/ch3.jpg" alt="Breach"></a>
    <a href="/anthem/"><img src="/img/tower/ch4.jpg" alt="Anthem"></a>
    <a href="/play/?mars=1"><img src="/img/mars/habitat.jpg" alt="Mars habitat"></a>
    <a href="/play/?mars=1"><img src="/img/mars/table.jpg" alt="Mars table"></a>
  </nav>
</main>

{{ partial "footer" . }}
