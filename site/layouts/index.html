{{ partial "header" . }}
{{ partial "sidebar" . }}

<main class="home">
  <section class="hero hero-photo" aria-label="WIDER opening">
    <img class="hero-still" src="/img/tower/ch1.jpg" alt="The Tower kitchen in a storm">
    <div class="hero-copy">
      <h1 class="hero-brand">{{ .Site.Title }}</h1>
      <p class="hero-line">{{ .Site.Params.tagline }}</p>
      <p class="hero-support">A teller. A kitchen that tried to be a fortress. Hungry guests. A table. Same Earth.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/story">The story</a>
        <a class="btn btn-ghost" href="/play/?b1=1">The storm</a>
        <a class="btn btn-ghost" href="/play">Play</a>
        <a class="btn btn-ghost" href="/road">Walk</a>
      </div>
    </div>
  </section>

  <nav class="frames" aria-label="Chapters">
    <a href="/play/?b1=1"><img src="/img/tower/ch1.jpg" alt="Chapter 1 — Fortifying the Mind"></a>
    <a href="/play/?b1=1"><img src="/img/tower/ch2.jpg" alt="Chapter 2 — The Onset of the Storm"></a>
    <a href="/play/?b1=1"><img src="/img/tower/ch3.jpg" alt="Chapter 3 — The Broken Threshold"></a>
    <a href="/play/?b1=1"><img src="/img/tower/ch4.jpg" alt="Chapter 4 — Rebirth in the Ashes"></a>
    <a href="/play/?mars=1"><img src="/img/mars/habitat.jpg" alt="Mars habitat"></a>
    <a href="/road/"><img src="/img/road/bville.jpg" alt="Bville still serves"></a>
    <a href="/road/?meet=princess"><img src="/img/road/kong.jpg" alt="High girder — the princess and the ape"></a>
  </nav>
</main>

{{ partial "footer" . }}
