{{ partial "header" . }}

<video loop muted autoplay playsinline id="home_video" class="video">
  <source src="/videos/SDVid.mp4" type="video/mp4">
  <source src="/videos/SDVid.ogg" type="video/ogg">
</video>
<div class="hero-scrim" aria-hidden="true"></div>

<div class="content container">
  <section class="hero">
    <span class="hero-om" aria-hidden="true">ॐ</span>
    <span class="hero-kicker">Nordic &middot; Nippon &middot; Vedic</span>
    <h1 class="hero-title">{{ .Site.Title }}</h1>
    <p class="hero-tagline">Where Scandinavian calm meets Japanese restraint and the warmth of Vedic spice.</p>
    <div class="hero-divider" aria-hidden="true"></div>
    <a class="hero-cta" href="/contact">Reserve a Table</a>
  </section>
</div>

{{ partial "footer" . }}
