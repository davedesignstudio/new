{{ partial "header" . }}

<div class="studio">
  {{ partial "sidebar" . }}

  <main class="studio__main">
    <header class="brand">
      <h1 class="brand__name">
        <span class="brand__line">D Hülhower</span>
      </h1>
      <div class="brand__mark" aria-hidden="true">
        {{ partial "skateboard" . }}
      </div>
      <p class="brand__studio">Studio</p>
    </header>

    <div class="studio__stage">
      <div class="feature-video" id="web-design">
        <video loop muted autoplay playsinline class="feature-video__media" poster="">
          <source src="/videos/SDVid.mp4" type="video/mp4">
          <source src="/videos/SDVid.ogg" type="video/ogg">
        </video>
        <span class="feature-video__caption">Video</span>
      </div>

      <div class="studio__aside">
        <nav class="site-nav" aria-label="Primary">
          <ul class="site-nav__list">
            <li>
              <a class="site-nav__link is-active" href="/">Home</a>
            </li>
            <li>
              <a class="site-nav__link site-nav__link--work" href="/work">
                Work
                <span class="site-nav__icon" aria-hidden="true">
                  {{ partial "skateboard-mini" . }}
                </span>
              </a>
            </li>
            <li>
              <a class="site-nav__cta" href="/contact">Call us</a>
            </li>
          </ul>
        </nav>

        <div class="social">
          <p class="social__label">Social</p>
          <ul class="social__list">
            <li>
              <a class="social__link" href="https://instagram.com" aria-label="Instagram" target="_blank" rel="noopener">
                <span class="social__dot"></span>
              </a>
            </li>
            <li>
              <a class="social__link" href="https://linkedin.com" aria-label="LinkedIn" target="_blank" rel="noopener">
                <span class="social__dot"></span>
              </a>
            </li>
            <li>
              <a class="social__link" href="https://behance.net" aria-label="Behance" target="_blank" rel="noopener">
                <span class="social__dot"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </main>
</div>

{{ partial "footer" . }}
