{{ partial "header" . }}

<div class="content container home">
  <video loop muted autoplay playsinline id="home_video" class="video">
    <source src="/videos/SDVid.mp4" type="video/mp4">
    <source src="/videos/SDVid.ogg" type="video/ogg">
  </video>
  <div class="home-scrim"></div>

  <div class="home-hero">
    <span class="kicker">Stockholm &middot; Kyoto &middot; Varanasi</span>
    <h1 class="hero-title">Stillness, served warm.</h1>
    <p class="hero-sanskrit sanskrit">अन्नं ब्रह्म &mdash; food is sacred</p>
    <p class="hero-lead">Nordic restraint, Japanese calm, and the slow fire of the Vedic hearth &mdash; one quiet table.</p>
    <div class="hero-actions">
      <a class="btn btn-solid" href="/food/">View the menu</a>
      <a class="btn btn-ghost" href="/contact">Reserve a table</a>
    </div>
  </div>
</div>

{{ partial "footer" . }}
