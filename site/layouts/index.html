{{ partial "header" . }}

<main class="hero">
  <div class="hero__media" aria-hidden="true">
    <video loop muted autoplay playsinline id="home_video" class="hero__video" poster="/img/gallery/photo2.jpg">
      <source src="/videos/SDVid.mp4" type="video/mp4">
      <source src="/videos/SDVid.ogg" type="video/ogg">
    </video>
    <div class="hero__veil"></div>
  </div>

  <div class="hero__copy">
    <p class="hero__sanskrit reveal" lang="sa">{{ .Site.Params.sanskrit }}</p>
    <h1 class="hero__brand reveal reveal--delay-1">{{ .Site.Title }}</h1>
    <p class="hero__headline reveal reveal--delay-2">{{ .Site.Params.tagline }}</p>
    <p class="hero__support reveal reveal--delay-3">{{ .Site.Params.description }}</p>
    <div class="hero__actions reveal reveal--delay-4">
      <a class="btn btn--primary" href="/contact">Reserve a table</a>
      <a class="btn btn--ghost" href="/food">View the menu</a>
    </div>
  </div>
</main>

{{ partial "footer" . }}
