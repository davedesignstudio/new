{{ partial "header" . }}

<video loop muted autoplay playsinline id="home_video" class="video">
  <source src="/videos/SDVid.mp4" type="video/mp4">
  <source src="/videos/SDVid.ogg" type="video/ogg">
</video>
<div class="hero-scrim"></div>

<main class="hero">
  <div class="hero-inner">
    <p class="hero-kicker">Lagom &middot; 侘寂 &middot; धर्म</p>
    <h1 class="hero-title">{{ .Site.Title }}</h1>
    <hr class="hero-rule">
    <p class="hero-sub">Nordic calm, Japanese precision, Vedic soul &mdash; a modern kitchen where less is plenty and the guest is divine.</p>
    <div class="hero-actions">
      <a class="btn btn-solid" href="/food">View the menu</a>
      <a class="btn btn-ghost" href="/contact">Reserve a table</a>
    </div>
  </div>
</main>

{{ partial "footer" . }}
