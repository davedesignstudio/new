{{ partial "header" . }}

<div class="content container home-hero">
  <video loop muted autoplay playsinline id="home_video" class="video">
    <source src="/videos/SDVid.mp4" type="video/mp4">
    <source src="/videos/SDVid.ogg" type="video/ogg">
  </video>
  <section class="hero-card" aria-label="Restaurant introduction">

    <p>Seasonal plates presented with Swedish restraint, Japanese balance, and saffron-toned Hindu geometry.</p>
    <a href="/food">Explore the menu</a>
  </section>
</div>

{{ partial "footer" . }}
