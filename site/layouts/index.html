{{ partial "header" . }}

<div class="content container home-hero">
  <video loop muted autoplay playsinline id="home_video" class="video">
    <source src="/videos/SDVid.mp4" type="video/mp4">
    <source src="/videos/SDVid.ogg" type="video/ogg">
  </video>

  <div class="home-hero-stack">
    <div class="home-hero-panel home-hero-panel--enter">
      <p class="home-hero-kicker">{{ .Site.Title }}</p>
      <h2 class="home-hero-title">Order ahead. Skip the wait.</h2>
      <p class="home-hero-copy">Pickup or delivery — same kitchen, same plates.</p>
      <div class="home-hero-actions">
        <a class="order-cta order-cta--hero" href="{{ .Site.Params.orderUrl | default "/order" }}">Order Online</a>
        <a class="home-hero-secondary" href="/food">View Menu</a>
      </div>
    </div>

    <nav class="path-strip home-hero-panel--enter" aria-label="Primary paths">
      <a class="path-strip-item path-strip-item--primary" href="{{ .Site.Params.orderUrl | default "/order" }}">
        <span class="path-strip-label">01</span>
        <span class="path-strip-title">Order</span>
      </a>
      <a class="path-strip-item" href="/food">
        <span class="path-strip-label">02</span>
        <span class="path-strip-title">Menu</span>
      </a>
      <a class="path-strip-item" href="/contact">
        <span class="path-strip-label">03</span>
        <span class="path-strip-title">Reserve</span>
      </a>
    </nav>
  </div>
</div>

{{ partial "footer" . }}
