sections:
  - id: breakfast
    name: Eggs and skillets
    note: The morning table, from 6 a.m.
    items:
      - name: Two eggs
        price: "$9"
        description: Any style, with toast.
      - name: Two eggs with Taylor ham
        price: "$13"
        description: The Hills breakfast, plated the Jersey way.
      - name: Western omelette
        price: "$16"
        description: Peppers, onions, and ham.
      - name: Taylor ham omelette
        price: "$16"
        description: Pork roll folded into eggs.
      - name: Spanakopita skillet
        price: "$19"
