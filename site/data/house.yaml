      - name: Huevos rancheros skillet
        price: "$19"
        description: Corn tortillas, chorizo, black beans, cheddar, pico, sour cream, avocado.
      - name: Spicy chili avocado toast
        price: "$18"
        description: Sourdough, avocado, two eggs, chili crisp, and hot honey.
      - name: Eggs Benedict
        price: "$17"
        description: Canadian bacon, hollandaise.
      - name: Crab Benedict
        price: "$22"
        description: Crab cake under the sauce.
  - id: griddle
    name: Pancakes, French toast, waffles
    note: Sweet plates with a short stack if you want a lighter fork
    items:
      - name: Pancakes
        price: "$11"
      - name: Triple berry pancakes
        price: "$17"
        description: Warm fruit compote, whipped cream, powdered sugar.
      - name: Banana Nutella waffle
        price: "$16"
      - name: Triple berry French toast
        price: "$17"
      - name: Greek parfait
        price: "$12"
