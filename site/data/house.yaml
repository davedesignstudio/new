      - name: Chicken Argentino
        price: "$24"
        description: Grilled chicken, pico de gallo, potato and vegetable.
      - name: Penne vodka
        price: "$17"
      - name: Chicken penne vodka
        price: "$24"
      - name: Disco fries
        price: "$11"
